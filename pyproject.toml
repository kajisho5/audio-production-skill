[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-production-skill"
version = "0.1.0"
description = "Deterministic audio production execution Skill (gain, trim, cut, silence removal, fades, loudness normalisation, mix, channel conversion, noise reduction) on top of ffmpeg-skill. Not an AI agent."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "kajisho5"}]
keywords = ["audio", "ffmpeg", "loudness", "skill", "production"]
dependencies = []

[project.scripts]
audio-production = "audio_production.cli:main"

[project.urls]
Repository = "https://github.com/kajisho5/audio-production-skill"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = false
warn_unused_ignores = false
