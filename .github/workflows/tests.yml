name: tests
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * *"   # daily: a new ffmpeg-skill release on main is exercised without a commit here
  workflow_dispatch:
# Compatibility with ffmpeg-skill is capability detection, not a version window (docs/decisions.md ADR-15), so
# every OS / Python cell runs against BOTH the oldest commit this skill is verified with (0.12.2, the pre-1.10
# behaviour: no --overwrite, NORMALIZE result in the call's own response) and ffmpeg-skill's current main.
jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }}, ffmpeg-skill ${{ matrix.ffmpeg_skill }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.11"]
        ffmpeg_skill: ["336e0c4d6311d2407daaa529ad71fee641f59b37", "main"]
        include:
          - os: windows-latest
            python: "3.11"
            ffmpeg_skill: "336e0c4d6311d2407daaa529ad71fee641f59b37"
          - os: windows-latest
            python: "3.11"
            ffmpeg_skill: "main"
          - os: macos-latest
            python: "3.11"
            ffmpeg_skill: "336e0c4d6311d2407daaa529ad71fee641f59b37"
          - os: macos-latest
            python: "3.11"
            ffmpeg_skill: "main"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Fetch ffmpeg-skill (${{ matrix.ffmpeg_skill }})
        env:
          FFMPEG_SKILL_REF: ${{ matrix.ffmpeg_skill }}
        run: |
          git clone https://github.com/kajisho5/ffmpeg-skill vendor/ffmpeg-skill
          git -C vendor/ffmpeg-skill checkout "$FFMPEG_SKILL_REF"
          git -C vendor/ffmpeg-skill log -1 --format='ffmpeg-skill %H %s'
        shell: bash
      - run: ffprobe -version
        shell: bash
      - run: python -m pip install -e . pytest pyflakes
      - run: python -m pyflakes src tests
      - run: python -m pytest -q
        env:
          AUDIO_PRODUCTION_FFMPEG_SKILL_DIR: ${{ github.workspace }}/vendor/ffmpeg-skill
      - run: audio-production doctor --json --ffmpeg-skill vendor/ffmpeg-skill
        shell: bash
      - run: audio-production skill --json > contract.json
        shell: bash
      - run: python -c "import json; json.load(open('contract.json'))"
      - run: audio-production contract --check tests/contract/contract.json --json
        shell: bash
